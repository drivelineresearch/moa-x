<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>__PAGE_TITLE__</title>
<style>
/* ---------------------------------------------------------------------------
   MoA-X run report — white surface (Driveline design language).
   Pure white canvas, 8px Mine Shaft top bar, goldenrod sole accent,
   ZERO box-shadows, hand-crafted SVG charts. No external requests.
   Font strategy: use a portable system stack so this self-contained report
   redistributes no font binaries and makes no external font requests.
--------------------------------------------------------------------------- */
:root {
  --gold: #FFA300;
  --burnt: #CF7F00;
  --ink: #262626;
  --black: #000000;
  --white: #FFFFFF;
  --panel: #F4F4F5;
  --secondary: #6B7280;
  --muted: #9CA3AF;
  --track: #E5E7EB;
  --green: #10B981;
  --red: #EF4444;
  --dist: #D1D5DB;
  /* Monospace-forward, developer-tool aesthetic. All system fonts so the
     single-file artifact stays self-contained (no external font requests). */
  --font-head: 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', 'SF Mono', 'Menlo', 'Consolas', 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  --font-body: 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', 'SF Mono', 'Menlo', 'Consolas', 'DejaVu Sans Mono', 'Liberation Mono', monospace;
  --font-mono: 'JetBrains Mono', 'Cascadia Code', 'SFMono-Regular', 'SF Mono', 'Menlo', 'Consolas', 'DejaVu Sans Mono', 'Liberation Mono', monospace;
}
*, *::before, *::after { box-sizing: border-box; }
svg, svg * { filter: none; }
html { scroll-behavior: smooth; max-width: 100%; overflow-x: hidden; }
body {
  margin: 0;
  max-width: 100%;
  overflow-x: hidden;
  background: var(--white);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--burnt); text-decoration: none; border-bottom: 1px solid var(--track); overflow-wrap: anywhere; }
a:hover { color: var(--gold); border-color: var(--gold); }

.topbar { height: 8px; background: var(--ink); width: 100%; position: sticky; top: 0; z-index: 60; }

.wrap { width: 100%; max-width: 1180px; min-width: 0; margin: 0 auto; padding: 0 28px; }

h1, h2, h3, .head { font-family: var(--font-head); text-transform: uppercase; letter-spacing: 0.01em; font-weight: 800; }
h2.section-title { font-size: 1.6rem; margin: 0 0 4px; }
.section-kicker { font-family: var(--font-head); text-transform: uppercase; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.14em; color: var(--gold); }
.section-note { color: var(--secondary); font-size: 0.86rem; line-height: 1.55; max-width: 78ch; margin: 6px 0 20px; }
.section-note b { color: var(--ink); }
section.block { padding: 44px 0; border-top: 1px solid var(--track); }
section.block:first-of-type { border-top: none; }

/* ---- Header ---- */
header.report-head { padding: 40px 0 30px; }
.report-head .eyebrow { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
.brandmark { font-family: var(--font-head); font-weight: 800; text-transform: uppercase; letter-spacing: 0.04em; font-size: 1.1rem; }
.brandmark .x { color: var(--gold); }
.report-head h1 { font-size: 2.5rem; line-height: 1.14; margin: 0 0 18px; max-width: 26ch; letter-spacing: 0.005em; }
.head-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin: 0 0 22px; }
.final-jump {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 10px 16px;
  border: 1px solid var(--ink);
  border-radius: 8px;
  background: var(--ink);
  color: var(--white);
  font-family: var(--font-head);
  font-size: .76rem;
  font-weight: 800;
  letter-spacing: .05em;
  text-transform: uppercase;
}
.final-jump:hover, .final-jump:focus-visible { border-color: var(--gold); background: var(--gold); color: var(--ink); }
.final-jump:focus-visible { outline: 3px solid rgba(255,163,0,.35); outline-offset: 3px; }
.report-share-action { display: inline-flex; align-items: center; justify-content: center; min-height: 44px; padding: 10px 16px; border: 1px solid var(--gold); border-radius: 8px; background: var(--white); color: var(--burnt); font-family: var(--font-head); font-size: .76rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; cursor: pointer; }
.report-share-action:hover, .report-share-action:focus-visible { background: #fff5dd; border-color: var(--burnt); color: var(--ink); }
.report-share-action:focus-visible { outline: 3px solid rgba(255,163,0,.35); outline-offset: 3px; }
.report-share-status { color: var(--secondary); font-size: .78rem; }
.head-actions .action-note { color: var(--secondary); font-size: .78rem; }
.meta-row { display: flex; flex-wrap: wrap; gap: 8px 26px; align-items: center; color: var(--secondary); font-size: 0.85rem; margin-bottom: 20px; }
.meta-row b { color: var(--ink); font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; max-width: 100%; align-items: center; gap: 7px; padding: 5px 12px; border: 1px solid var(--track); border-radius: 999px; font-size: 0.8rem; background: var(--white); overflow-wrap: anywhere; }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
.chip .role { color: var(--muted); font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.06em; }
.badge { display: inline-block; padding: 4px 11px; border-radius: 6px; font-family: var(--font-head); font-weight: 800; text-transform: uppercase; font-size: 0.68rem; letter-spacing: 0.08em; }
.badge.ok { background: var(--gold); color: var(--white); }
.badge.warn { background: var(--red); color: var(--white); }
.badge.neutral { background: var(--panel); color: var(--ink); }
.report-art { position: relative; margin: 22px 0 24px; overflow: hidden; border: 1px solid var(--track); border-radius: 12px; background: var(--panel); }
.report-art img { width: 100%; height: 210px; display: block; object-fit: cover; object-position: center; }
.report-art.hero-art { margin-top: 22px; }
.report-art.hero-art img { height: clamp(240px, 31vw, 350px); object-position: center 44%; }
.report-art.scout-art img { object-position: center 48%; }
.report-art figcaption {
  position: absolute;
  right: 12px;
  bottom: 12px;
  max-width: min(78%, 560px);
  padding: 8px 11px;
  color: var(--white);
  background: rgba(38, 38, 38, .88);
  border-left: 3px solid var(--gold);
  border-radius: 4px;
  font-size: .72rem;
  line-height: 1.35;
}

/* ---- Reader-first summary ---- */
.executive-overview {
  display: grid;
  grid-template-columns: minmax(0, 1.5fr) minmax(220px, .5fr);
  gap: 22px;
  align-items: start;
  margin: 0 0 22px;
  padding: 22px;
  border: 1px solid var(--track);
  border-left: 5px solid var(--gold);
  border-radius: 12px;
  background: var(--white);
}
.executive-overview .label { color: var(--burnt); font-family: var(--font-head); font-size: .66rem; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; }
.executive-overview h3 { margin: 5px 0 8px; font-size: 1.1rem; line-height: 1.35; text-transform: none; }
.executive-overview p { margin: 0; color: var(--secondary); }
.executive-facts { display: grid; gap: 8px; margin: 0; padding: 0; list-style: none; }
.executive-facts li { padding: 8px 10px; border-radius: 7px; background: var(--panel); font-size: .78rem; }
.executive-facts b { color: var(--ink); }

/* ---- Static contributor network ---- */
.agent-network { margin-top: 24px; border: 1px solid var(--track); border-radius: 12px; overflow: hidden; }
.agent-network .network-copy { padding: 20px 20px 0; }
.agent-network .network-copy h3 { margin: 4px 0 6px; font-size: 1.08rem; text-transform: none; }
.agent-network .network-copy p { margin: 0; color: var(--secondary); font-size: .84rem; }
.agent-network .report-art { margin: 18px 20px; }
.agent-network .report-art img { height: clamp(190px, 26vw, 280px); }
.network-flow { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--track); }
.network-stage { position: relative; min-width: 0; padding: 16px; border-right: 1px solid var(--track); }
.network-stage:last-child { border-right: 0; }
.network-stage .stage-n { color: var(--gold); font-family: var(--font-head); font-size: .62rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
.network-stage .stage-title { margin: 3px 0 5px; font-weight: 800; }
.network-stage .stage-desc { color: var(--secondary); font-size: .76rem; line-height: 1.45; }
.network-roster { margin-top: 8px; color: var(--ink); font-family: var(--font-mono); font-size: .7rem; overflow-wrap: anywhere; }

/* ---- Sticky nav ---- */
nav.mininav { position: sticky; top: 8px; z-index: 50; background: rgba(255,255,255,0.94); backdrop-filter: blur(4px); border-bottom: 1px solid var(--track); }
nav.mininav .inner { display: flex; gap: 4px; overflow-x: auto; padding: 10px 0; }
nav.mininav a { border: none; font-family: var(--font-head); text-transform: uppercase; font-weight: 700; font-size: 0.72rem; letter-spacing: 0.06em; color: var(--secondary); padding: 6px 12px; border-radius: 6px; white-space: nowrap; }
nav.mininav a:hover { background: var(--panel); color: var(--ink); }
nav.mininav a.active { color: var(--ink); background: var(--panel); box-shadow: inset 0 -2px 0 var(--gold); }

/* ---- Stat tiles ---- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--white); border: 1px solid var(--track); border-radius: 12px; overflow: hidden; }
.tile { background: var(--white); padding: 18px 20px; border-right: 1px solid var(--track); border-bottom: 1px solid var(--track); }
.tile .k { font-family: var(--font-head); font-weight: 800; text-transform: uppercase; font-size: 0.64rem; letter-spacing: 0.1em; color: var(--muted); margin-bottom: 8px; }
.tile .v { font-family: var(--font-head); font-weight: 800; font-size: 1.9rem; line-height: 1; }
.tile .v small { font-size: 0.9rem; color: var(--secondary); }

/* ---- Collapsibles ---- */
.collapse { max-width: 100%; min-width: 0; border: 1px solid var(--track); border-radius: 12px; margin-bottom: 14px; overflow: hidden; }
.collapse > .c-head { display: flex; width: 100%; align-items: center; gap: 12px; padding: 16px 20px; cursor: pointer; user-select: none; background: var(--white); border: 0; color: var(--ink); font: inherit; text-align: left; }
.collapse > .c-head:hover { background: var(--panel); }
.collapse > .c-head:focus-visible { outline: 3px solid var(--gold); outline-offset: -3px; }
.collapse > .c-head .c-title { min-width: 0; overflow-wrap: anywhere; font-family: var(--font-head); font-weight: 800; text-transform: uppercase; font-size: 0.92rem; letter-spacing: 0.02em; flex: 1; }
.collapse > .c-head .caret { color: var(--muted); transition: transform 0.2s ease; font-size: 0.8rem; }
.collapse.open > .c-head .caret { transform: rotate(90deg); }
.collapse > .c-body { max-height: 0; overflow: hidden; transition: max-height 0.32s ease; }
.collapse > .c-body, .collapse > .c-body > .pad { min-width: 0; }
.collapse > .c-body > .pad { padding: 4px 20px 22px; }
.reduced .collapse > .c-body { transition: none; }

.c-head .status-pip { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.pip-ok { background: var(--green); }
.pip-fail { background: var(--red); }
.pip-warn { background: var(--gold); }
.c-head .mini-stats { min-width: 0; display: flex; gap: 14px; color: var(--secondary); font-size: 0.76rem; overflow-wrap: anywhere; }
.c-head .mini-stats span b { color: var(--ink); }

/* ---- Text + code ---- */
.summary-text { font-size: 1rem; line-height: 1.6; margin: 6px 0 18px; }
.subhead { font-family: var(--font-head); font-weight: 800; text-transform: uppercase; font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted); margin: 22px 0 10px; }
code.inline { font-family: var(--font-mono); font-size: 0.85em; background: var(--panel); padding: 1px 6px; border-radius: 4px; }
.codeblock { font-family: var(--font-mono); font-size: 0.82rem; background: var(--panel); border-radius: 10px; padding: 16px 18px; overflow-x: auto; white-space: pre-wrap; word-break: break-word; line-height: 1.5; }

/* ---- Plan steps ---- */
.step { border-left: 3px solid var(--track); padding: 4px 0 4px 18px; margin: 0 0 20px; }
.step .step-n { font-family: var(--font-head); font-weight: 800; color: var(--gold); font-size: 0.8rem; }
.step .step-title { font-weight: 700; margin: 2px 0 6px; }
.step .why { color: var(--secondary); margin-bottom: 10px; }
.ev-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
.ev { display: inline-flex; max-width: 100%; align-items: center; gap: 6px; font-size: 0.74rem; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--track); font-family: var(--font-mono); overflow-wrap: anywhere; white-space: normal; }
.ev.code { background: var(--panel); }
.ev.ext { background: var(--white); }
.ev .tag { text-transform: uppercase; font-family: var(--font-head); font-size: 0.6rem; letter-spacing: 0.06em; color: var(--muted); }
.files { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
.file-tok { max-width: 100%; font-family: var(--font-mono); font-size: 0.74rem; color: var(--secondary); background: var(--panel); padding: 2px 7px; border-radius: 4px; overflow-wrap: anywhere; white-space: normal; }
.risk { font-size: 0.82rem; color: var(--secondary); padding-left: 16px; position: relative; margin: 3px 0; }
.risk::before { content: "△"; position: absolute; left: 0; color: var(--gold); font-size: 0.7rem; top: 2px; }

/* ---- Tables ---- */
.table-scroll { width: 100%; max-width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; -webkit-overflow-scrolling: touch; }
table.dl { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 0.88rem; }
table.dl th, table.dl td { text-align: left; padding: 9px 12px; border-bottom: 1px solid var(--track); }
table.dl th { font-family: var(--font-head); text-transform: uppercase; font-size: 0.66rem; letter-spacing: 0.08em; color: var(--muted); font-weight: 800; }

/* ---- Verdict matrix ---- */
.matrix { width: 100%; max-width: 100%; overflow-x: auto; overscroll-behavior-inline: contain; -webkit-overflow-scrolling: touch; }
.matrix table { border-collapse: separate; border-spacing: 6px; }
.matrix th { font-family: var(--font-head); text-transform: uppercase; font-size: 0.66rem; letter-spacing: 0.06em; color: var(--secondary); padding: 4px 8px; text-align: center; font-weight: 800; }
.matrix th.rowh { text-align: right; color: var(--ink); }
.mcell { min-width: 108px; height: 52px; border-radius: 8px; padding: 7px 9px; cursor: default; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.mcell .verdict { font-family: var(--font-head); text-transform: uppercase; font-size: 0.6rem; letter-spacing: 0.04em; font-weight: 800; }
.mcell.v-accept_as_is { background: rgba(16,185,129,0.16); color: #0b7a5a; }
.mcell.v-accept_with_changes { background: rgba(255,163,0,0.18); color: #9a6300; }
.mcell.v-reject { background: rgba(239,68,68,0.15); color: #b3271e; }
.mcell.v-none { background: var(--panel); color: var(--muted); }
.grade-note { margin: 0 0 12px; color: var(--secondary); font-size: .78rem; }
.grade-board { display: grid; grid-template-columns: repeat(auto-fit, minmax(185px, 1fr)); gap: 10px; margin: 0 0 18px; }
.grade-card { min-width: 0; padding: 13px 14px; border: 1px solid var(--track); border-radius: 9px; background: var(--white); }
.grade-card .grade-label { color: var(--muted); font-family: var(--font-head); font-size: .6rem; font-weight: 800; letter-spacing: .07em; text-transform: uppercase; }
.grade-card .grade-main { display: flex; align-items: baseline; gap: 9px; margin-top: 3px; }
.grade-card .grade-letter { color: var(--burnt); font-family: var(--font-head); font-size: 1.55rem; font-weight: 800; line-height: 1; }
.grade-card .grade-name { min-width: 0; overflow-wrap: anywhere; font-weight: 800; }
.grade-card .grade-detail { margin-top: 6px; color: var(--secondary); font-size: .7rem; line-height: 1.45; }

/* ---- Verification dots ---- */
.verif-row { margin: 14px 0; }
.verif-row .vlabel { display: flex; gap: 10px; align-items: baseline; margin-bottom: 8px; }
.verif-row .vlabel .name { font-family: var(--font-head); font-weight: 800; text-transform: uppercase; font-size: 0.8rem; }
.verif-row .vlabel .counts { font-size: 0.78rem; color: var(--secondary); }
.dots { display: flex; flex-wrap: wrap; gap: 6px; }
.vdot { width: 15px; height: 15px; border-radius: 4px; cursor: pointer; }
.vdot.verified { background: var(--green); }
.vdot.unverified { background: var(--track); }
.vdot.contradicted { background: var(--red); }
.vdetail { display: none; margin-top: 10px; font-size: 0.85rem; background: var(--panel); border-radius: 8px; padding: 12px 14px; }
.vdetail.show { display: block; }
.vdetail .vd-path { font-family: var(--font-mono); font-size: 0.78rem; color: var(--burnt); }

/* ---- Cards / disagreements ---- */
.cardgrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(280px, 100%), 1fr)); gap: 14px; }
.dcard { border: 1px solid var(--track); border-left: 3px solid var(--gold); border-radius: 10px; padding: 14px 16px; }
.dcard .who { font-family: var(--font-head); text-transform: uppercase; font-weight: 800; font-size: 0.68rem; letter-spacing: 0.06em; color: var(--muted); margin-bottom: 6px; }
.dcard .pt { font-weight: 700; margin-bottom: 6px; }
.dcard .lbl { font-family: var(--font-head); text-transform: uppercase; font-size: 0.62rem; letter-spacing: 0.06em; color: var(--gold); margin: 8px 0 2px; }
.checklist { list-style: none; padding: 0; margin: 0; }
.checklist li { padding-left: 24px; position: relative; margin: 7px 0; }
.checklist li::before { content: "✓"; position: absolute; left: 0; color: var(--green); font-weight: 800; }
.flaglist { list-style: none; padding: 0; margin: 0; }
.flaglist li { padding-left: 24px; position: relative; margin: 7px 0; }
.flaglist li::before { content: "!"; position: absolute; left: 3px; color: var(--red); font-weight: 800; font-family: var(--font-head); }

/* ---- Pull quote (synthesis) ---- */
.pullquote { position: relative; padding: 6px 0 6px 54px; margin: 6px 0; }
.pullquote::before { content: "\201C"; position: absolute; left: 0; top: -14px; font-family: Georgia, serif; font-size: 5rem; color: var(--gold); line-height: 1; }
.pullquote .q { font-size: 1.05rem; line-height: 1.55; font-style: italic; }
.pullquote .by { font-family: var(--font-head); text-transform: uppercase; font-weight: 800; font-size: 0.72rem; letter-spacing: 0.06em; color: var(--secondary); margin-top: 8px; }

/* ---- Logs ---- */
.log-tabs { display: flex; gap: 4px; margin-bottom: 10px; }
.log-tabs button { font-family: var(--font-head); text-transform: uppercase; font-weight: 700; font-size: 0.68rem; letter-spacing: 0.05em; padding: 6px 14px; border: 1px solid var(--track); background: var(--white); border-radius: 6px; cursor: pointer; color: var(--secondary); }
.log-tabs button.active { background: var(--ink); color: var(--white); border-color: var(--ink); }
.log-filter { width: 100%; padding: 8px 12px; border: 1px solid var(--track); border-radius: 8px; font-family: var(--font-mono); font-size: 0.8rem; margin-bottom: 10px; }
.log-view { width: 100%; max-width: 100%; font-family: var(--font-mono); font-size: 0.78rem; background: var(--panel); border-radius: 10px; max-height: 460px; overflow: auto; padding: 12px 0; }
.log-line { display: flex; padding: 0 14px; white-space: pre-wrap; word-break: break-word; }
.log-line:hover { background: rgba(255,163,0,0.08); }
.log-line .ln { color: var(--muted); user-select: none; min-width: 46px; text-align: right; padding-right: 14px; flex: none; }
.log-line.hidden { display: none; }
.log-empty { padding: 12px 14px; color: var(--muted); font-family: var(--font-body); }

/* ---- Controls ---- */
.controls { display: flex; gap: 8px; margin-bottom: 16px; }
.btn { font-family: var(--font-head); text-transform: uppercase; font-weight: 700; font-size: 0.68rem; letter-spacing: 0.05em; padding: 7px 14px; border: 1px solid var(--track); background: var(--white); border-radius: 6px; cursor: pointer; color: var(--ink); }
.btn:hover { background: var(--panel); }
.btn:focus-visible { outline: 3px solid rgba(255,163,0,.35); outline-offset: 2px; }
.btn.primary { min-height: 40px; padding: 9px 14px; border-color: var(--ink); background: var(--ink); color: var(--white); }
.btn.primary:hover { border-color: var(--gold); background: var(--gold); color: var(--ink); }

/* ---- Scope columns ---- */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
.two-col ul { padding-left: 18px; margin: 6px 0; }
.qa { margin: 10px 0; }
.qa .q { font-weight: 700; }
.qa .a { color: var(--secondary); }

/* ---- Final plan render ---- */
.plan-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; margin: 0 0 18px; padding: 14px; border: 1px solid var(--track); border-radius: 10px; background: var(--panel); }
.plan-actions .copy-status { color: var(--secondary); font-size: .78rem; }
.plan-actions .copy-status.ok { color: #0b7a5a; font-weight: 700; }
.plan-actions .copy-status.fail { color: #b3271e; font-weight: 700; }
.plan-actions .copy-fallback { flex-basis: 100%; width: 100%; min-height: 150px; padding: 10px 12px; border: 1px solid var(--gold); border-radius: 7px; background: var(--white); color: var(--ink); font: .76rem/1.45 var(--font-mono); resize: vertical; }
.plan-render h1, .plan-render h2, .plan-render h3 { text-transform: none; font-family: var(--font-head); margin: 22px 0 8px; }
.plan-render h1 { font-size: 1.5rem; } .plan-render h2 { font-size: 1.2rem; } .plan-render h3 { font-size: 1rem; }
.plan-render p { margin: 8px 0; } .plan-render ul, .plan-render ol { padding-left: 22px; }
.plan-render li { margin: 4px 0; }
.plan-render pre { font-family: var(--font-mono); font-size: 0.82rem; background: var(--panel); border-radius: 10px; padding: 14px 16px; overflow-x: auto; }

.timeline-row.is-retry .timeline-who .role { color: var(--burnt); font-weight: 700; }
@keyframes timeline-stripes { to { background-position: 20px 0; } }
.timeline-duration { color: var(--secondary); font-size: .72rem; white-space: nowrap; }
.timeline-legend { margin: 12px 0 0; color: var(--secondary); font-size: .72rem; line-height: 1.5; }

/* ---- Decision lineage explorer ---- */
.lineage-shell { width: 100%; max-width: 100%; min-width: 0; border: 1px solid var(--track); border-radius: 12px; overflow: hidden; background: var(--white); }

.lineage-viewport svg { display: block; min-width: 760px; }

.lineage-node.is-muted { opacity: .32; }
.lineage-edge { transition: opacity 160ms ease, stroke-width 160ms ease; stroke-linecap: round; }
.lineage-edge.is-muted { opacity: .12 !important; }
.lineage-edge.is-highlighted { opacity: 1 !important; stroke-width: 3.5 !important; }
.lineage-edge-halo { fill: none; stroke-linecap: round; pointer-events: none; }
.lineage-detail { border-top: 1px solid var(--track); padding: 14px 18px 18px; min-height: 112px; }
.lineage-detail .kind { color: var(--burnt); font-family: var(--font-head); font-size: 0.64rem; text-transform: uppercase; font-weight: 800; letter-spacing: 0.07em; }
.lineage-detail .detail-title { font-weight: 800; margin: 3px 0 5px; }
.lineage-detail .detail-body { color: var(--secondary); font-size: 0.84rem; }
.lineage-detail .detail-note { margin-top: 8px; border-left: 3px solid var(--gold); padding-left: 10px; font-size: 0.8rem; }
.lineage-files { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 9px; }
.lineage-rejected { border-top: 1px solid var(--track); padding: 14px 18px; }

.lineage-rejected ul { margin-bottom: 0; }
.lineage-warning { margin-top: 12px; }

/* ---- Tooltip ---- */
#tooltip { position: fixed; z-index: 100; pointer-events: none; background: rgba(0,0,0,0.9); color: #fff; font-size: 0.76rem; line-height: 1.4; padding: 8px 11px; border-radius: 8px; max-width: 320px; display: none; }
#tooltip .tt-h { color: var(--gold); font-family: var(--font-head); text-transform: uppercase; font-size: 0.62rem; letter-spacing: 0.06em; margin-bottom: 3px; }

/* ---- Flowchart footer ---- */
.flow svg { width: 100%; height: auto; }
footer.foot { border-top: 1px solid var(--track); padding: 30px 0 60px; color: var(--muted); font-size: 0.8rem; }

.notice { background: rgba(239,68,68,0.08); border: 1px solid rgba(239,68,68,0.3); border-radius: 10px; padding: 14px 18px; margin-bottom: 18px; color: #b3271e; }
.notice.info { background: var(--panel); border-color: var(--track); color: var(--ink); }
.empty-note { color: var(--muted); font-style: italic; }

@media (max-width: 720px) {
  .wrap { padding: 0 16px; }
  .report-head h1 { font-size: 2rem; }

  .timeline-stage-head { display: block; }

  .timeline-row { grid-template-columns: 1fr 56px; gap: 6px 10px; }

}

}

  section.block { padding: 20px 0; }
}

<body>
<div class="topbar"></div>

<script type="application/json" id="moa-data">__MOA_DATA_JSON__</script>

<div class="wrap" id="app"></div>

<script>
"use strict";
(function () {
  var DATA = JSON.parse(document.getElementById("moa-data").textContent);
  var ART = __REPORT_ASSET_JSON__;
  var REDUCED = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (REDUCED) document.body.classList.add("reduced");

  var C = { gold: "#FFA300", green: "#10B981", red: "#EF4444", ink: "#262626", track: "#E5E7EB", muted: "#9CA3AF" };

  // ---- tiny DOM helper ----
  function el(tag, attrs, kids) {

  }
  function esc(s) { var d = document.createElement("div"); d.textContent = s == null ? "" : String(s); return d.innerHTML; }

  function statusPip(r) { return r.success ? "pip-ok" : (r.transient_empty ? "pip-warn" : "pip-fail"); }

  var app = document.getElementById("app");
  var sections = [];
  function addSection(id, navLabel, node) { sections.push({ id: id, label: navLabel }); app.appendChild(node); }
  function reportArt(key, alt, caption, className) {

    return el("figure", { class: "report-art " + (className || "") }, [
      el("img", { src: ART[key], alt: alt, loading: key === "hero" ? "eager" : "lazy" }),
      el("figcaption", { text: caption })
    ]);
  }
  function scrollTable(table) {
    return el("div", { class: "table-scroll", tabindex: "0", role: "region", "aria-label": "Scrollable table" }, table);
  }

  // Only the authenticated Web UI artifact route has a job identity. Reports
  // opened from disk or through a public link remain portable and network-free.
  function currentArtifactJobId() {
    var match = window.location.pathname.match(/^\/api\/jobs\/([^/]+)\/artifacts\/report\.html$/);
    return match ? decodeURIComponent(match[1]) : null;
  }
  function summarizeLineageFinding(value, maxLength) {
    var text = String(value || "").replace(/\s+/g, " ").trim();
    if (text.length <= maxLength) return text;
    return text.slice(0, Math.max(1, maxLength - 1)).replace(/[\s,;:.-]+$/, "") + "…";
  }
  async function shareCurrentWebReport(jobId, button, status) {
    button.disabled = true;
    status.textContent = "Creating a revocable link…";
    try {
      var response = await fetch("/api/jobs/" + encodeURIComponent(jobId) + "/share", { method: "POST", credentials: "same-origin" });
      var payload = await response.json().catch(function () { return {}; });
      if (!response.ok || !payload.url) throw new Error(payload.error || "Could not create a share link.");
      var url = new URL(payload.url, window.location.origin).href;
      try {
        await navigator.clipboard.writeText(url);
        status.textContent = "Share link copied. Creating another link or revoking it in the run view disables this one.";
        button.textContent = "Link copied";
      } catch (_) {
        status.textContent = "Share link ready: " + url;
        button.textContent = "Link ready";
      }
    } catch (error) {
      status.textContent = error.message || "Could not create a share link.";
      button.textContent = "Share report";
    } finally {
      button.disabled = false;
    }
  }

  // ---------------------------------------------------------------- Header
  (function () {
    var head = el("header", { class: "report-head" });
    head.appendChild(el("div", { class: "eyebrow" }, [
      el("div", { class: "brandmark", html: 'MoA<span class="x">-X</span> &nbsp;RUN REPORT' }),
      el("div", { class: "badge " + (DATA.partial ? "warn" : "neutral"), text: DATA.partial ? "Partial (recommendations only)" : "Full session" })
    ]));
    head.appendChild(el("h1", { text: DATA.title || DATA.session_id }));
    var actions = el("div", { class: "head-actions" }, [
      el("a", { class: "final-jump", href: "#plan", text: DATA.final_plan_html ? "Jump to final recommendation →" : "Check recommendation status →" })
    ]);
    var jobId = currentArtifactJobId();
    if (jobId) {
      var shareStatus = el("span", { class: "report-share-status", "aria-live": "polite" });
      var shareButton = el("button", { class: "report-share-action", type: "button", text: "Share report" });
      shareButton.addEventListener("click", function () { shareCurrentWebReport(jobId, shareButton, shareStatus); });
      actions.appendChild(shareButton);
      actions.appendChild(shareStatus);
    }
    actions.appendChild(el("span", { class: "action-note", text: DATA.final_plan_html ? "Skip the process details and start with the answer." : "This run may still need its final synthesis." }));
    head.appendChild(actions);
    head.appendChild(reportArt(
      "hero",
      "Independent researchers sending evidence toward one coherent architectural blueprint",
      "Independent model lanes. One evidence-backed decision trail.",
      "hero-art"
    ));
    var l2badge;
    if (DATA.layer2_mode === "broadcast") l2badge = el("span", { class: "badge ok", text: "all recommendations reviewed" });
    else if (DATA.layer2_mode === "degraded_non_broadcast") l2badge = el("span", { class: "badge warn", text: "limited review" });
    else l2badge = el("span", { class: "badge neutral", text: DATA.layer2_mode || "n/a" });
    var l2span = el("span", {}, ["Review mode "]); l2span.appendChild(l2badge);
    head.appendChild(el("div", { class: "meta-row" }, [
      el("span", { html: "Session <b>" + esc(DATA.session_id) + "</b>" }),
      el("span", { html: "Generated <b>" + esc(DATA.generated_at) + "</b>" }),
      el("span", { html: "Wall-clock <b>" + fmtDur(DATA.duration_seconds) + "</b>" }),
      l2span
    ]));
    if (DATA.timing_normalized) head.appendChild(el("div", { class: "notice info", text: "Timing repaired for a legacy phase-split manifest: wall-clock and chart offsets use the earliest retained agent start instead of the Layer 2 invocation start." }));
    var chips = el("div", { class: "chips" });
    (DATA.config && DATA.config.proposers || []).forEach(function (p) { chips.appendChild(providerChip(p, "proposer")); });
    (DATA.config && DATA.config.refiners || []).forEach(function (p) { chips.appendChild(providerChip(p, "refiner")); });
    if (DATA.config && DATA.config.aggregator) chips.appendChild(providerChip(DATA.config.aggregator, "aggregator"));
    if (DATA.config && DATA.config.proposer_instances) DATA.config.proposer_instances.forEach(function (n) { chips.appendChild(providerChip({ name: n, harness: "claude" }, "proposer")); });
    if (DATA.config && DATA.config.refiner_instances) DATA.config.refiner_instances.forEach(function (n) { chips.appendChild(providerChip({ name: n, harness: "claude" }, "refiner")); });
    head.appendChild(chips);
    app.appendChild(head);
  })();
  function providerChip(p, role) {
    return el("span", { class: "chip" }, [
      el("span", { class: "dot" }),
      el("span", { html: "<b>" + esc(p.name) + "</b>" }),
      el("span", { class: "role", text: p.model || p.harness || role })
    ]);
  }

  // ---------------------------------------------------------------- Overview tiles
  (function () {
    var l1 = DATA.layer1 || [], l2 = DATA.layer2 || [], l3 = DATA.layer3 || [];
    var agentSecs = l1.concat(l2, l3).reduce(function (a, r) { return a + (r.duration_seconds || 0); }, 0);
    var sec = el("section", { class: "block", id: "overview" });
    sec.appendChild(el("div", { class: "section-kicker", text: "Start here" }));
    sec.appendChild(el("h2", { class: "section-title", text: "What happened and what to read" }));
    sec.appendChild(buildExecutiveOverview(l1, l2, l3));
    var tiles = el("div", { class: "tiles" });
    function tile(k, v, sub) { return el("div", { class: "tile" }, [el("div", { class: "k", text: k }), el("div", { class: "v", html: v + (sub ? ' <small>' + sub + '</small>' : '') })]); }
    tiles.appendChild(tile("Independent plans", l1.filter(function (r) { return r.success; }).length + "/" + l1.length));
    tiles.appendChild(tile("Reviews", l2.filter(function (r) { return r.success; }).length + "/" + l2.length));
    if (l3.length) tiles.appendChild(tile("Final synthesis", l3.filter(function (r) { return r.success; }).length + "/" + l3.length));
    tiles.appendChild(tile("Total model time", fmtDur(agentSecs)));
    tiles.appendChild(tile("Elapsed time", fmtDur(DATA.duration_seconds)));
    var speedup = DATA.duration_seconds ? (agentSecs / DATA.duration_seconds).toFixed(1) + "×" : "—";
    tiles.appendChild(tile("Parallel speed-up", speedup));
    sec.appendChild(tiles);
    var health = DATA.summary || {}, healthItems = [];
    if ((health.timeout_failures || []).length) healthItems.push("Timed out: " + health.timeout_failures.join(", "));
    if ((health.transient_empty_proposers || []).length) healthItems.push("Transient-empty proposers: " + health.transient_empty_proposers.join(", "));
    if ((health.transient_empty_refiners || []).length) healthItems.push("Transient-empty refiners: " + health.transient_empty_refiners.join(", "));
    if ((health.agent_id_mismatches || []).length) healthItems.push("Identity mismatches: " + health.agent_id_mismatches.map(function (m) { return m.agent_id + " reported " + m.reported_agent_id; }).join(", "));
    if ((health.workspace_mutation_failures || []).length) healthItems.push("Workspace mutation failures: " + health.workspace_mutation_failures.join(", "));
    if (healthItems.length) {
      var healthNotice = el("div", { class: "notice" });
      healthNotice.appendChild(el("b", { text: "Run health needs attention" }));
      healthNotice.appendChild(ul(healthItems));
      sec.appendChild(healthNotice);
    }
    sec.appendChild(buildAgentNetwork());
    addSection("overview", "Summary", sec);
  })();
  function buildExecutiveOverview(l1, l2, l3) {
    var lineage = DATA.final_plan_lineage || {};
    var hasFinal = !!DATA.final_plan_html;
    var successful = l1.concat(l2, l3).filter(function (r) { return r.success; }).length;
    var total = l1.length + l2.length + l3.length;
    var box = el("div", { class: "executive-overview" });
    box.appendChild(el("div", {}, [
      el("div", { class: "label", text: hasFinal ? "Executive overview" : "Run status" }),
      el("h3", { text: lineage.title || (hasFinal ? "A final recommendation is ready" : "The final recommendation is not available yet") }),
      el("p", { text: lineage.summary || (hasFinal
        ? "The team produced a final recommendation from the independent plans and review findings below. Start with the recommendation, then use the decision trail when you need to understand why a step was chosen."

    ]));
    box.appendChild(el("ul", { class: "executive-facts" }, [
      el("li", { html: "<b>" + successful + " of " + total + "</b> recorded contributors completed successfully" }),
      el("li", { html: "<b>" + l1.length + "</b> independent plan" + (l1.length === 1 ? "" : "s") + " and <b>" + l2.length + "</b> review" + (l2.length === 1 ? "" : "s") }),
      el("li", { html: hasFinal ? "<b>Final recommendation:</b> available below" : "<b>Final recommendation:</b> not yet recorded" })
    ]));
    return box;

        spans.push({ r: r, attempt: r, previous: false, start: Math.max(0, recorded == null ? derivedStart : recorded), dur: Math.max(0, Number(r.duration_seconds) || 0) });
      });
      var stageStart = spans.reduce(function (value, span) { return Math.min(value, span.start); }, Infinity);
      if (!isFinite(stageStart)) stageStart = derivedStart;
      var stageEnd = spans.reduce(function (value, span) { return Math.max(value, span.start + span.dur); }, stageStart);
      var activeWindow = Math.max(1, stageEnd - stageStart);
      var handoffDelay = Math.max(0, stageStart - previousEnd);
      var retryCount = definition.rows.filter(function (r) { return Boolean(r.previous_attempt); }).length;

      var stage = el("section", { class: "timeline-stage stage-" + definition.number, "aria-label": "Stage " + definition.number + ": " + definition.title });
      stage.appendChild(el("div", { class: "timeline-stage-head" }, [
        el("div", { class: "timeline-stage-title" }, [
          el("span", { class: "number", text: "Stage " + definition.number }),
          el("h3", { text: definition.title })
        ]),
        el("div", { class: "timeline-stage-meta", text: "Began " + fmtOffset(stageStart) + " · active for " + fmtDur(activeWindow) })
      ]));
      if (definition.number > 1 && handoffDelay > 5) {
        stage.appendChild(el("div", {
          class: "timeline-gap",
          text: fmtDur(handoffDelay) + " between stages for handoff, waiting, or retries."
        }));
      }
      if (retryCount) {
        stage.appendChild(el("div", {
          class: "timeline-retry-summary",
          text: retryCount + " lane" + (retryCount === 1 ? " was" : "s were") + " rerun after incomplete output; the hatched interval is the wait before that retry began."
        }));
      }

      var rows = el("div", { class: "timeline-rows" });
      spans.forEach(function (span) {
        var left = Math.max(0, Math.min(100, (span.start - stageStart) / activeWindow * 100));
        var width = Math.max(.8, Math.min(100 - left, span.dur / activeWindow * 100));
        var state = span.attempt.success ? "completed" : (span.attempt.transient_empty ? "returned no usable response" : "did not complete");
        var retry = !span.previous && Number(span.r.attempt || 1) > 1;
        var retryWait = null;
        if (retry && span.r.previous_attempt) {
          var priorStart = typeof span.r.previous_attempt.started_at === "number" && t0 ? span.r.previous_attempt.started_at - t0 : stageStart;
          var priorEnd = Math.max(stageStart, priorStart + (Number(span.r.previous_attempt.duration_seconds) || 0));
          if (span.start - priorEnd > 5) {
            retryWait = {
              left: Math.max(0, Math.min(100, (priorEnd - stageStart) / activeWindow * 100)),
              width: Math.max(.8, Math.min(100, (span.start - priorEnd) / activeWindow * 100)),
              duration: span.start - priorEnd
            };
          }
        }
        var barClass = "timeline-bar" + (span.attempt.success ? "" : (span.attempt.transient_empty ? " transient" : " failed")) + (span.previous ? " previous" : "") + (retry ? " retry" : "");
        var rowStatus = span.previous
          ? (span.attempt.transient_empty ? "initial attempt — incomplete response" : "initial attempt failed")
          : (retry ? "rerun completed" : state);
        var track = el("div", {
          class: "timeline-track",
          role: "img",
          "aria-label": span.r.agent_id + " attempt " + (span.attempt.attempt || 1) + " " + state + " in " + fmtDur(span.dur) + (retryWait ? "; retry queued for " + fmtDur(retryWait.duration) + " after incomplete output" : "")
        });
        if (retryWait) track.appendChild(el("span", { class: "timeline-retry-wait", title: "Retry queued after incomplete output: " + fmtDur(retryWait.duration), style: "left:" + retryWait.left.toFixed(2) + "%;width:" + retryWait.width.toFixed(2) + "%" }));
        track.appendChild(el("span", { class: barClass, style: "left:" + left.toFixed(2) + "%;width:" + width.toFixed(2) + "%" }));
        rows.appendChild(el("div", { class: "timeline-row" + (retry || span.previous ? " is-retry" : "") }, [
          el("div", { class: "timeline-who" }, [
            el("div", { class: "name", text: span.r.agent_id + ((span.attempt.attempt || 1) > 1 || span.previous ? " · attempt " + (span.attempt.attempt || 1) : "") }),
            el("div", { class: "role", text: String(span.r.role || "contributor").replace(/-/g, " ") + " · " + rowStatus })
          ]),
          track,
          el("div", { class: "timeline-duration", text: fmtDur(span.dur) })
        ]));
      });
      stage.appendChild(rows);
      shell.appendChild(stage);
      previousEnd = Math.max(previousEnd, stageEnd);
      derivedStart = previousEnd;
    });
    shell.appendChild(el("p", {
      class: "timeline-legend",
      style: "padding:0 20px 16px",
      text: "Stage 1, 2, and 3 use distinct striped colors. A gray retry row is the replaced attempt; the amber hatch marks time queued before the rerun started. Each stage uses its own readable scale."
    }));
    return shell;
  }
  function fmtOffset(seconds) { return seconds < 1 ? "at run start" : fmtDur(seconds) + " into the run"; }

  // ---------------------------------------------------------------- SVG helpers
  function svgEl(tag, attrs) { var n = document.createElementNS("http://www.w3.org/2000/svg", tag); for (var k in attrs) n.setAttribute(k, attrs[k]); return n; }
  function svgText(x, y, text, attrs) { var t = svgEl("text", Object.assign({ x: x, y: y, "font-family": "Arial, sans-serif" }, attrs || {})); t.textContent = text; return t; }

  // ---------------------------------------------------------------- Nav + scrollspy
  (function () {
    var inner = document.getElementById("mininav-inner");
    sections.forEach(function (s) { inner.appendChild(el("a", { href: "#" + s.id, text: s.label })); });
    var links = Array.prototype.slice.call(inner.querySelectorAll("a"));
    function spy() {
      var y = window.scrollY + 120, cur = sections[0].id;
      sections.forEach(function (s) { var e = document.getElementById(s.id); if (e && e.offsetTop <= y) cur = s.id; });
      links.forEach(function (a) { a.className = a.getAttribute("href") === "#" + cur ? "active" : ""; });
    }
    window.addEventListener("scroll", spy); spy();
  })();

  // ---------------------------------------------------------------- Tooltip
  (function () {
    var tip = document.getElementById("tooltip");
    document.addEventListener("mouseover", function (e) {
      var t = e.target.closest ? e.target.closest("[data-tip]") : null;
      if (!t || !t.getAttribute("data-tip")) return;
      tip.innerHTML = (t.getAttribute("data-tiph") ? '<div class="tt-h">' + esc(t.getAttribute("data-tiph")) + "</div>" : "") + esc(t.getAttribute("data-tip"));
      tip.style.display = "block";
    });
    document.addEventListener("mousemove", function (e) {
      if (tip.style.display !== "block") return;
      var x = e.clientX + 14, y = e.clientY + 16;
      if (x + tip.offsetWidth > window.innerWidth - 10) x = e.clientX - tip.offsetWidth - 14;
      if (y + tip.offsetHeight > window.innerHeight - 10) y = e.clientY - tip.offsetHeight - 16;
      tip.style.left = x + "px"; tip.style.top = y + "px";
    });
    document.addEventListener("mouseout", function (e) {
      var t = e.target.closest ? e.target.closest("[data-tip]") : null;
      if (t) tip.style.display = "none";
    });
  })();
})();
</script>
</body>
</html>

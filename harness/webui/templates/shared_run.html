<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>MoA-X · Run progress</title><link rel="icon" type="image/png" href="{{ request.script_root }}/favicon.ico"><style>body{font:16px/1.6 system-ui;background:#f5f7fa;color:#1c293a;margin:0}main{max-width:950px;margin:32px auto;background:white;padding:32px;border-radius:12px}h1{font-size:26px;line-height:1.3}progress{width:100%;height:20px}li{margin:12px 0}a{color:#1d57a5}#summary{white-space:pre-wrap}@media(max-width:650px){main{margin:0;padding:20px}}</style><main><p>MoA-X · Shared run view</p><h1 id="title">Loading run…</h1><p id="state"></p><p id="source"></p><progress id="progress" max="1" value="0"></progress><p id="summary"></p><h2>Models</h2><ul id="agents"></ul><h2>Results</h2><ul id="artifacts"></ul><p>Questions, settings and cancellation are handled in the Slack request’s thread.</p></main><script>
const endpoint={{ status_url|tojson }};
async function update(){
 try{
  const response=await fetch(endpoint,{cache:'no-store'});
  if(!response.ok)throw new Error('This run link is unavailable or has expired.');
  const job=await response.json();
  document.querySelector('#title').textContent=job.title;
  document.querySelector('#state').textContent=job.status+' · '+job.phase;
  document.querySelector('#source').textContent=job.source?.commit?'Source commit '+job.source.commit+(job.source.ref?' · '+job.source.ref:''):'';
  document.querySelector('#progress').value=job.progress||0;
  document.querySelector('#summary').textContent=job.summary||'';
  const agents=document.querySelector('#agents');agents.replaceChildren();
  for(const agent of job.agents||[]){const li=document.createElement('li');li.textContent=(agent.label||agent.id)+' · '+(agent.model||'')+' · '+(agent.status||'pending');agents.append(li);}
  const links=document.querySelector('#artifacts');links.replaceChildren();
  for(const [label,url] of Object.entries(job.artifacts||{})){const li=document.createElement('li'),a=document.createElement('a');a.textContent=label.replaceAll('_',' ');a.href=url;li.append(a);links.append(li);}
  if(!['completed','failed','cancelled','imported'].includes(job.status))setTimeout(update,5000);
 }catch(error){document.querySelector('#state').textContent=error.message;}
}update();
</script></html>

# MoA-X harness config — copy to harness/config.yaml to activate.
#
# Curated routes:
#   codex          -> Codex CLI / gpt-6-astra (high)
#   codex-luna     -> Codex CLI / gpt-6-luna (medium)
#   codex-sol      -> Codex CLI / gpt-6.1-sol (xhigh default aggregator)
#   sonnet         -> Claude Code / claude-sonnet-5-5 (high)
#   opus           -> Claude Code / claude-opus-5-5 (high; aggregator-capable)
#   fable          -> Claude Code / claude-fable-5-1 (xhigh; aggregator only)
#   agy-gemini-pro -> AGY / gemini-4-argon-high
#   grok           -> OpenCode Go / grok-4.7
#   glm            -> OpenCode Go / glm-5.3 (Thorough proposer)
#   minimax        -> OpenCode Go / minimax-m3 (optional proposer/refiner)
#   muse-spark     -> OpenCode Go / muse-spark-1.3-contributor (optional; trains on data)
#   deepseek-flash -> OpenCode Go / deepseek-v4.1-flash (default refiner)
#
# Cursor routes are unsupported. Optional routes stay out of recommended presets.
# Qwen, Moonshot and MiMo are excluded from new launches, even via aliases.
# Archived manifests retain every original lab attribution.
#
# Built-in balanced ensemble. Refiners are lab-independent from the OpenAI
# aggregator; Gemini Pro and Grok enter the evidence pipeline immediately.
layers:
  proposers: [agy-gemini-pro, grok, codex-luna]
  refiners: [deepseek-flash, opus]
  aggregator: codex-sol
  skip_refinement: false

# User-defined providers may use only supported harnesses:
# codex, claude, opencode, agy, or gemini.
#
# providers:
#   custom-reviewer:
#     harness: opencode
#     model: provider/model-id
#     timeout: 600
#     effort: high
#
# layers:
#   proposers: [agy-gemini-pro, grok, codex-luna]
#   refiners: [deepseek-flash, opus, custom-reviewer]
#   aggregator: codex-sol
#
# Secrets belong in .env or the shell, never in this file. Optional custom routes may use
# the existing OpenCode Go account. Per-route overrides use:
#   MOA_<NAME>_MODEL, MOA_<NAME>_TIMEOUT, MOA_<NAME>_EFFORT
#
# Fable can replace codex-sol only as the aggregator. The Web UI adds a
# password warning because its 1M-thinking route can consume extreme quota.
